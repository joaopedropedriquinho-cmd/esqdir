services:
  - type: web
    name: live-battle
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/state
    disk:
      name: live-battle-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TIKTOK_USERNAME
        value: quiz_azul
      - key: SCORE_FILE
        value: /var/data/score.json
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TIKTOK_RED_ROSE_GIFT_IDS
        sync: false
      - key: TIKTOK_WHITE_ROSE_GIFT_IDS
        sync: false
      - key: TIKTOK_SIGN_API_KEY
        sync: false