<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11120e">
  <title>Live Battle | Quiz Azul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="battle" aria-label="Placar Live Battle">
    <section class="team team--left" aria-label="Equipe esquerda">
      <div class="team__wash"></div>
      <header class="team__header"><span class="team__index">01 / TIME</span><span class="team__rule"></span></header>
      <div class="team__identity">
        <svg class="star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 3 61 37 97 37 68 58 79 93 50 72 21 93 32 58 3 37 39 37Z"/></svg>
        <p class="team__name">ESQUERDA</p>
      </div>
      <div class="team__score" id="left-score" aria-live="polite">0</div>
      <div class="team__label">PONTOS</div>
      <div class="score-pop" id="left-pop" aria-hidden="true"></div>
      <div class="team__foot"><span>ROSA VERMELHA</span><span class="team__foot-mark">✳</span></div>
    </section>

    <section class="team team--right" aria-label="Equipe direita">
      <div class="team__wash"></div>
      <header class="team__header"><span class="team__index">02 / TIME</span><span class="team__rule"></span></header>
      <div class="team__identity team__identity--right">
        <span class="right-mark" aria-hidden="true">✳</span>
        <p class="team__name">DIREITA</p>
      </div>
      <div class="team__score" id="right-score" aria-live="polite">0</div>
      <div class="team__label">PONTOS</div>
      <div class="score-pop" id="right-pop" aria-hidden="true"></div>
      <div class="team__foot"><span>ROSA BRANCA</span><span class="team__foot-mark">✳</span></div>
    </section>

    <div class="topbar">
      <div class="live-status" id="live-status"><span class="live-status__dot"></span><span id="live-label">LIVE DESCONECTADA</span></div>
      <a class="account" href="https://www.tiktok.com/@quiz_azul/live" target="_blank" rel="noreferrer"><span class="account__at">@</span><span id="account-name">quiz_azul</span></a>
      <div class="topbar__actions"><button class="small-button" id="connect-button" type="button">CONECTAR LIVE</button><button class="small-button small-button--quiet" id="disconnect-button" type="button">DESCONECTAR</button></div>
    </div>

    <div class="matchup" aria-label="Placar central">
      <div class="matchup__score"><span>ESQUERDA</span><strong id="center-left">0</strong><i>×</i><strong id="center-right">0</strong><span>DIREITA</span></div>
      <div class="ratio"><span class="ratio__left" id="left-ratio">50%</span><div class="ratio__track"><span id="ratio-fill"></span></div><span class="ratio__right" id="right-ratio">50%</span></div>
    </div>

    <aside class="event-feed" id="event-feed" aria-live="polite" aria-label="Últimos presentes"></aside>
    <a class="admin-link" href="/admin" aria-label="Abrir painel de administração">PAINEL <span>↗</span></a>
    <div class="connection-note" id="connection-note" aria-live="polite"></div>
  </main>

  <dialog class="start-live-dialog" id="start-live-dialog" aria-labelledby="start-live-title">
    <form id="start-live-form">
      <p class="start-live-dialog__eyebrow">ACESSO PROTEGIDO</p>
      <h1 id="start-live-title">Iniciar conexão</h1>
      <label for="start-live-password">Senha para iniciar a live</label>
      <input id="start-live-password" name="password" type="password" autocomplete="current-password" required>
      <p class="start-live-dialog__error" id="start-live-error" role="alert"></p>
      <div class="start-live-dialog__actions">
        <button class="small-button small-button--quiet" id="cancel-start-live" type="button">CANCELAR</button>
        <button class="small-button" type="submit">CONECTAR</button>
      </div>
    </form>
  </dialog>

  <div class="rose-alert" id="rose-alert" aria-hidden="true" aria-live="assertive">
    <div class="rose-alert__panel" role="status">
      <div class="rose-alert__symbols" aria-hidden="true">
        <svg class="rose-alert__heart" viewBox="0 0 48 48"><path d="M24 43S4 31.5 4 17.2C4 9.1 14.4 4.1 24 14.5 33.6 4.1 44 9.1 44 17.2 44 31.5 24 43 24 43Z"/></svg>
        <svg class="rose-alert__flower" viewBox="0 0 96 96">
          <path class="rose-alert__stem" d="M48 53c1 14-5 22-7 32m6-19c-8-8-15-7-20-5 4 9 11 12 20 10m1-4c7-8 14-8 19-6-4 9-11 12-20 11"/>
          <path class="rose-alert__bloom" d="M48 12c-9-7-20-1-18 9-10-2-17 8-11 16-9 7-6 20 5 22 0 11 12 17 21 10 9 7 21 1 21-10 11-2 14-15 5-22 6-8-1-18-11-16 2-10-9-16-18-9Z"/>
          <path class="rose-alert__detail" d="M30 25c5-5 10-4 13 1-6 1-9 5-9 10 7-1 12-5 14-11 7 5 9 11 7 16-2 6-8 9-12 15m5-15c-1-7 4-12 11-14"/>
        </svg>
        <svg class="rose-alert__heart" viewBox="0 0 48 48"><path d="M24 43S4 31.5 4 17.2C4 9.1 14.4 4.1 24 14.5 33.6 4.1 44 9.1 44 17.2 44 31.5 24 43 24 43Z"/></svg>
      </div>
      <h2 class="rose-alert__title" id="rose-alert-title">ROSA VERMELHA</h2>
      <p class="rose-alert__team" id="rose-alert-team">ESQUERDA +1</p>
      <p class="rose-alert__sender" id="rose-alert-sender">@usuario enviou uma rosa vermelha</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
